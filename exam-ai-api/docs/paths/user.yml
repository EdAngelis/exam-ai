root:
    post:
      summary: Create a new user
      operationId: createUser
      tags:
        - Users
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.schemas.yml#/User'
      responses:
        '201':
          description: User created successfully
        '400':
          description: Invalid input
    get:
      summary: Get all users
      operationId: getAllUsers
      tags:
        - Users
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/user.schemas.yml#/User'
        '401':
          description: Unauthorized
id:
    get:
      summary: Get a user by ID
      operationId: getUserById
      tags:
        - Users
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '../schemas/user.schemas.yml#/User'
        '404':
          description: User not found
    put:
      summary: Update a user by ID
      operationId: updateUser
      tags:
        - Users
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.schemas.yml#/User'
      responses:
        '200':
          description: User updated successfully
        '400':
          description: Invalid input
        '404':
          description: User not found
    delete:
      summary: Delete a user by ID
      operationId: deleteUser
      tags:
        - Users
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted successfully
        '404':
          description: User not found
