User:
  type: object
  properties:
    name:
      type: string
      default: "John Doe"
    email:
      type: string
      default: "example@example.com"
    password:
      type: string
      default: "password123"
    gameInviteCode:
      type: string
      pattern: '^[0-9]{6}$'
  required:
    - email
