name: Expo Dev Client Build

# One-off build of the installable dev-client native binary. Not tied to PRs —
# only needs re-running when native deps / config plugins change (adding a
# native module, bumping the Expo SDK, editing app.json's native config).
# Trigger manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android

defaults:
  run:
    working-directory: exam-ai-mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: exam-ai-mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS build (development profile)
        run: eas build --profile development --platform ${{ github.event.inputs.platform }} --non-interactive --no-wait
