name: Deploy API (staging)

# Deploys a preview of exam-ai-api to the `exam-ai-api-staging` stack whenever a
# PR to main is opened, updated, or reopened AND touches the API folder. The
# staging API URL is posted back as a PR comment.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "exam-ai-api/**"
      - ".github/workflows/deploy-api-staging.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

# One shared staging stack: a newer push cancels an in-flight staging deploy.
concurrency:
  group: deploy-api-staging
  cancel-in-progress: true

defaults:
  run:
    working-directory: exam-ai-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: exam-ai-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: SAM build
        run: sam build

      - name: SAM deploy
        env:
          DB_URI: ${{ secrets.DB_URI }}
          DB_NAME: ${{ secrets.DB_NAME }}
          API_KEY: ${{ secrets.API_KEY }}
          MOBILE_API_KEY: ${{ secrets.MOBILE_API_KEY }}
          APP_SECRET: ${{ secrets.SECRET }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          APP_AWS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          APP_AWS_SECRET: ${{ secrets.AWS_SECRET }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
        run: |
          sam deploy \
            --stack-name exam-ai-api-staging \
            --region us-east-1 \
            --resolve-s3 \
            --s3-prefix exam-ai-api-staging \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "DbUri=$DB_URI" \
              "DbName=$DB_NAME" \
              "ApiKey=$API_KEY" \
              "MobileApiKey=$MOBILE_API_KEY" \
              "Secret=$APP_SECRET" \
              "OpenAiApiKey=$OPEN_AI_API_KEY" \
              "ResendApiKey=$RESEND_API_KEY" \
              "ResendFromEmail=$RESEND_FROM_EMAIL" \
              "AwsKeyId=$APP_AWS_KEY_ID" \
              "AwsSecret=$APP_AWS_SECRET" \
              "BucketName=$BUCKET_NAME" \
              "AppRegion=us-east-1" \
              "GoogleClientId=$GOOGLE_CLIENT_ID" \
              "ClientUrl=$CLIENT_URL"

      - name: Read API URL
        id: url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name exam-ai-api-staging \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Comment staging URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- staging-api-url -->';
            const url = '${{ steps.url.outputs.api_url }}';
            const body = `${marker}\n🚀 **Staging API deployed:** ${url}\n\nStack: \`exam-ai-api-staging\` · commit \`${context.sha.slice(0, 7)}\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
